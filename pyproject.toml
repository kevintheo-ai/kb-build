[project]
name = "kb-build"
version = "0.1.0"
description = "Searchable knowledge bases and grounded specialist sub-agents for Claude Code: harvest, chunk, embed (BGE-M3 hybrid) into Qdrant, evaluate, keep fresh."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "SIM", "RUF"]
ignore = [
    "E501",  # long lines are left to the formatter
    "S603",  # subprocess with an argument list is intended (kb_refresh runs the other scripts)
    "S310",  # urllib: the fetcher checks scheme and host itself (https only, public addresses)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
